spring.application.name=fabricore

# Server port
server.port=8080

# Database connection (PostgreSQL in Docker container)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fabricore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT and Authentication keys
jwt.secret=${JWT_SECRET:fabricore-super-secure-local-development-jwt-token-secret-key-1234}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
